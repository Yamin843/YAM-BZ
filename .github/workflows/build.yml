name: Build YAM-BZ

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: |
          yes | sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Fetch ImGui
        run: bash scripts/fetch_imgui.sh

      - name: Build Pass 1 (produce dex + APK)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Embed assets (dex + albatross so)
        run: bash scripts/embed_assets.sh

      - name: Build Pass 2 (final .so with embedded)
        run: |
          ./gradlew clean
          ./gradlew :app:assembleRelease --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          find app/build -name "libyambz.so" -exec cp {} artifacts/ \;
          find app/build -name "*.apk"     -exec cp {} artifacts/ \;
          ls -lh artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yambz-${{ github.sha }}
          path: artifacts/
          retention-days: 30
